<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Círculo Mágico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #ccc; cursor: grab; }
    body:active { cursor: grabbing; }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(14px);
      border: 1px solid rgba(180,180,200,0.22); border-radius: 14px;
      padding: 12px 15px; max-width: 270px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      transition: opacity 0.3s, transform 0.3s;
    }
    #ui.hidden { opacity: 0; transform: translateX(-18px); pointer-events: none; }
    #ui h1 { font-size: 0.92rem; font-weight: 600; margin-bottom: 3px; color: #ddd; }
    #ui p { font-size: 0.68rem; opacity: 0.55; margin-bottom: 8px; line-height: 1.3; }
    .controls { display: flex; flex-direction: column; gap: 5px; }
    .control-row { display: flex; align-items: center; gap: 7px; font-size: 0.68rem; }
    .control-row label { min-width: 70px; opacity: 0.8; }
    input[type="range"] { flex: 1; accent-color: #999; height: 3px; }
    button {
      background: rgba(35,35,45,0.95); border: 1px solid rgba(160,160,180,0.28);
      color: #bbb; padding: 6px 10px; border-radius: 8px; cursor: pointer;
      font-size: 0.7rem; width: 100%; margin-top: 2px; transition: all 0.2s;
    }
    button:hover { background: rgba(55,55,70,0.95); border-color: rgba(200,200,220,0.45); }
    button.active { background: rgba(70,60,40,0.9); border-color: rgba(210,190,130,0.45); color: #e0d0a0; }
    #toggleUi {
      position: absolute; top: 14px; left: 14px; z-index: 11;
      width: 34px; height: 34px; border-radius: 9px;
      background: rgba(0,0,0,0.75); border: 1px solid rgba(160,160,180,0.3);
      color: #aaa; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #toggleUi:hover { color: #fff; background: rgba(25,25,35,0.9); }
    #fps { position: absolute; bottom: 10px; right: 12px; font-size: 0.6rem; opacity: 0.25; z-index: 10; }
    #phase-label {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; opacity: 0.35; z-index: 10; letter-spacing: 1.5px; color: #999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <h1>✦ Círculo Mágico</h1>
    <p>Arrastra = girar · Rueda = zoom · Click = Invocar</p>
    <div class="controls">
      <div class="control-row"><label>Velocidad</label><input type="range" id="speed" min="0" max="2.5" step="0.1" value="0.7"></div>
      <div class="control-row"><label>Partículas</label><input type="range" id="particles" min="0" max="1600" step="100" value="600"></div>
      <div class="control-row"><label>Brillo</label><input type="range" id="glow" min="0.3" max="2" step="0.1" value="1.1"></div>
      <div class="control-row"><label>Volumen</label><input type="range" id="volume" min="0" max="1" step="0.05" value="0.25"></div>
      <button id="btnDecompose">Descomponer / Recomponer</button>
      <button id="btnInvoke">⚡ Invocar</button>
      <button id="btnSound">Activar Sonido</button>
      <button id="btnTheme">Oscuro / Brillante</button>
      <button id="btnAuto">Auto-rotación</button>
      <button id="btnReset">Restablecer</button>
    </div>
  </div>
  <button id="toggleUi" title="Ocultar/Mostrar panel">☰</button>
  <div id="fps">FPS: --</div>
  <div id="phase-label">CÍRCULO COMPLETO</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const CFG = {
      speed: 0.7, glow: 1.1, volume: 0.25,
      particleCount: 600, darkMode: true, soundOn: false, decompose: 0
    };

    const CIRCLE_IMG = './circle.jpg';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.007);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 26, 0.05);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.15, 0.38, 0.12);
    composer.addPass(bloom);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 9;
    controls.maxDistance = 75;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.3;
    controls.target.set(0, 0, 0);

    const ambient = new THREE.AmbientLight(0x12121a, 0.3);
    scene.add(ambient);
    const p1 = new THREE.PointLight(0xffffff, 1.6, 110);
    p1.position.set(0, 10, 0); scene.add(p1);
    const p2 = new THREE.PointLight(0x8899bb, 0.4, 50);
    p2.position.set(12, 2, 10); scene.add(p2);

    const root = new THREE.Group();
    scene.add(root);

    const loader = new THREE.TextureLoader();
    const mainTex = loader.load(CIRCLE_IMG);
    mainTex.colorSpace = THREE.SRGBColorSpace;

    const mainMat = new THREE.MeshBasicMaterial({
      map: mainTex, transparent: true, opacity: 1,
      side: THREE.DoubleSide, depthWrite: false
    });
    const mainDisc = new THREE.Mesh(new THREE.CircleGeometry(14, 128), mainMat);
    mainDisc.rotation.x = -Math.PI / 2;
    root.add(mainDisc);

    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.08,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const glowRing = new THREE.Mesh(new THREE.RingGeometry(13.6, 15.2, 128), glowMat);
    glowRing.rotation.x = -Math.PI / 2;
    glowRing.position.y = 0.01;
    root.add(glowRing);

    const extraRings = [];
    [4, 7, 10, 13].forEach((r, i) => {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.02, 8, 100),
        new THREE.MeshBasicMaterial({
          color: 0xccccff, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false
        })
      );
      m.rotation.x = Math.PI / 2;
      root.add(m);
      extraRings.push({
        mesh: m, speed: 0.12 * (i % 2 ? 1 : -1),
        targetY: (i - 1.5) * 1.1, targetTilt: (Math.random() - 0.5) * 0.55
      });
    });

    let pSys, pPos, pVel;
    function makeParticles(n) {
      if (pSys) { root.remove(pSys); pSys.geometry.dispose(); pSys.material.dispose(); }
      const geo = new THREE.BufferGeometry();
      pPos = new Float32Array(n * 3); pVel = [];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 1.5 + Math.random() * 15;
        const y = (Math.random() - 0.5) * 3.5;
        pPos[i*3] = Math.cos(a)*r; pPos[i*3+1] = y; pPos[i*3+2] = Math.sin(a)*r;
        pVel.push({ a, r, y, sp: 0.08 + Math.random()*0.35, ys: (Math.random()-0.5)*0.1, ph: Math.random()*Math.PI*2 });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pc = document.createElement('canvas'); pc.width = 32; pc.height = 32;
      const px = pc.getContext('2d');
      const pg = px.createRadialGradient(16,16,0,16,16,16);
      pg.addColorStop(0, 'rgba(255,255,255,1)');
      pg.addColorStop(0.35, 'rgba(220,220,240,0.45)');
      pg.addColorStop(1, 'rgba(0,0,0,0)');
      px.fillStyle = pg; px.fillRect(0,0,32,32);
      pSys = new THREE.Points(geo, new THREE.PointsMaterial({
        map: new THREE.CanvasTexture(pc), size: 0.2, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.65, sizeAttenuation: true
      }));
      root.add(pSys);
    }
    makeParticles(CFG.particleCount);

    const boltGroup = new THREE.Group(); root.add(boltGroup);
    let bolts = [], nextBolt = 2;
    function spawnBolt() {
      const pts = [];
      const a0 = Math.random() * Math.PI * 2;
      const a1 = a0 + (Math.random() - 0.5) * 1.4;
      const r0 = 1 + Math.random() * 2.5, r1 = 7 + Math.random() * 8;
      const segs = 8 + Math.floor(Math.random() * 6);
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const r = r0 + (r1 - r0) * t;
        const a = a0 + (a1 - a0) * t + (Math.random() - 0.5) * 0.3;
        const y = (Math.random() - 0.5) * 2.2 * Math.sin(t * Math.PI) * (0.15 + CFG.decompose);
        pts.push(new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r));
      }
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({
          color: 0xeeeeff, transparent: true, opacity: 0.8,
          blending: THREE.AdditiveBlending, depthWrite: false
        })
      );
      line.userData = { life: 0.22 + Math.random()*0.28, max: 0.38 };
      boltGroup.add(line); bolts.push(line);
    }

    let actx = null, master = null;
    function initAudio() {
      if (actx) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      [55, 82, 110].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.value = 0.055 / (i + 1); o.connect(g); g.connect(master); o.start();
      });
      const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*0.09;
      const ns = actx.createBufferSource(); ns.buffer = buf; ns.loop = true;
      const nf = actx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 340;
      const ng = actx.createGain(); ng.gain.value = 0.025;
      ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
    }
    function setVol(v) {
      CFG.volume = v;
      if (master) master.gain.setTargetAtTime(CFG.soundOn ? v : 0, actx.currentTime, 0.12);
    }
    function playInvoke() {
      if (!actx || !CFG.soundOn) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(95, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(28, actx.currentTime + 1.2);
      g.gain.setValueAtTime(0.14 * CFG.volume, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1.4);
      o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime + 1.5);
    }

    let invokeT = 0, invokeI = 0;
    let targetDecompose = 0;
    let autoRot = false;

    function triggerInvoke() {
      invokeT = 3; invokeI = 1;
      playInvoke();
      for (let i = 0; i < 8; i++) setTimeout(spawnBolt, i * 50);
      if (CFG.decompose < 0.2) targetDecompose = 0.5;
    }

    renderer.domElement.addEventListener('pointerdown', e => {
      const sx = e.clientX, sy = e.clientY;
      const up = u => {
        if (Math.abs(u.clientX - sx) < 5 && Math.abs(u.clientY - sy) < 5) triggerInvoke();
        renderer.domElement.removeEventListener('pointerup', up);
      };
      renderer.domElement.addEventListener('pointerup', up);
    });

    let last = performance.now(), fc = 0, ft = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const t = now * 0.001 * CFG.speed;

      CFG.decompose += (targetDecompose - CFG.decompose) * Math.min(1, dt * 1.1);
      const d = CFG.decompose;

      const label = document.getElementById('phase-label');
      if (d < 0.1) label.textContent = 'CÍRCULO COMPLETO';
      else if (d < 0.85) label.textContent = 'DESCOMPOSICIÓN';
      else label.textContent = 'ANILLOS FLOTANTES';

      if (Math.abs(targetDecompose - d) > 0.008) {
        const ty = 26 - d * 11;
        const tz = 0.05 + d * 20;
        camera.position.y += (ty - camera.position.y) * dt * 1.3;
        camera.position.z += (tz - camera.position.z) * dt * 1.3;
        controls.target.set(0, 0, 0);
      }
      controls.autoRotate = d > 0.3 && autoRot;

      if (invokeT > 0) { invokeT -= dt; invokeI = Math.max(0, invokeT / 3); }
      const boost = 1 + invokeI * 1.3;

      mainDisc.rotation.z += 0.015 * dt * CFG.speed;
      mainMat.opacity = 1 - d * 0.4;
      glowMat.opacity = 0.07 + d * 0.08 + invokeI * 0.12;

      extraRings.forEach(r => {
        r.mesh.material.opacity = d * 0.4;
        r.mesh.position.y = r.targetY * d;
        r.mesh.rotation.x = Math.PI / 2 + r.targetTilt * d;
        r.mesh.rotation.z += r.speed * dt * CFG.speed;
      });

      if (pSys && pPos) {
        const arr = pSys.geometry.attributes.position.array;
        for (let i = 0; i < pVel.length; i++) {
          const v = pVel[i];
          v.a += v.sp * dt * CFG.speed * 0.25 * boost;
          v.y += v.ys * dt;
          if (v.y > 3 || v.y < -3) v.ys *= -1;
          arr[i*3] = Math.cos(v.a) * v.r;
          arr[i*3+1] = v.y + Math.sin(t + v.ph) * 0.2 * (0.15 + d);
          arr[i*3+2] = Math.sin(v.a) * v.r;
        }
        pSys.geometry.attributes.position.needsUpdate = true;
        pSys.material.opacity = 0.25 + d * 0.45;
      }

      nextBolt -= dt;
      if (nextBolt <= 0) {
        if (Math.random() < 0.18 + d * 0.3 + invokeI * 0.35) spawnBolt();
        nextBolt = 0.7 + Math.random() * 1.6 - d * 0.3;
      }
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i];
        b.userData.life -= dt;
        b.material.opacity = Math.max(0, b.userData.life / b.userData.max) * 0.8;
        if (b.userData.life <= 0) {
          boltGroup.remove(b); b.geometry.dispose(); b.material.dispose(); bolts.splice(i, 1);
        }
      }

      p1.intensity = (1.4 + Math.sin(t * 1.3) * 0.25) * boost;
      bloom.strength = 0.95 * CFG.glow * (1 + invokeI * 0.85);
      renderer.toneMappingExposure = CFG.darkMode ? 0.95 : 1.3;

      controls.update();
      composer.render();

      fc++;
      if (now - ft > 500) {
        document.getElementById('fps').textContent = `FPS: ${Math.round(fc / ((now - ft) / 1000))}`;
        fc = 0; ft = now;
      }
    }

    const uiEl = document.getElementById('ui');
    const toggleBtn = document.getElementById('toggleUi');
    let uiVisible = true;
    toggleBtn.style.left = '290px';
    toggleBtn.onclick = () => {
      uiVisible = !uiVisible;
      uiEl.classList.toggle('hidden', !uiVisible);
      toggleBtn.style.left = uiVisible ? '290px' : '14px';
    };

    document.getElementById('speed').oninput = e => { CFG.speed = +e.target.value; controls.autoRotateSpeed = 0.3 * CFG.speed; };
    document.getElementById('particles').oninput = e => { CFG.particleCount = +e.target.value; makeParticles(CFG.particleCount); };
    document.getElementById('glow').oninput = e => { CFG.glow = +e.target.value; };
    document.getElementById('volume').oninput = e => setVol(+e.target.value);

    document.getElementById('btnDecompose').onclick = function() {
      targetDecompose = targetDecompose > 0.5 ? 0 : 1;
      this.classList.toggle('active', targetDecompose > 0.5);
      this.textContent = targetDecompose > 0.5 ? 'Recomponer' : 'Descomponer / Recomponer';
    };
    document.getElementById('btnInvoke').onclick = () => {
      initAudio();
      if (!CFG.soundOn) {
        CFG.soundOn = true; setVol(CFG.volume);
        document.getElementById('btnSound').textContent = 'Silenciar';
        document.getElementById('btnSound').classList.add('active');
      }
      triggerInvoke();
    };
    document.getElementById('btnSound').onclick = function() {
      initAudio(); CFG.soundOn = !CFG.soundOn; setVol(CFG.volume);
      this.textContent = CFG.soundOn ? 'Silenciar' : 'Activar Sonido';
      this.classList.toggle('active', CFG.soundOn);
    };
    document.getElementById('btnTheme').onclick = () => {
      CFG.darkMode = !CFG.darkMode;
      scene.fog.density = CFG.darkMode ? 0.007 : 0.004;
      ambient.intensity = CFG.darkMode ? 0.3 : 0.5;
    };
    document.getElementById('btnAuto').onclick = function() {
      autoRot = !autoRot;
      this.classList.toggle('active', autoRot);
      this.textContent = autoRot ? 'Pausar auto-rotación' : 'Auto-rotación';
    };
    document.getElementById('btnReset').onclick = () => {
      camera.position.set(0, 26, 0.05);
      controls.target.set(0, 0, 0);
      targetDecompose = 0; CFG.decompose = 0;
      document.getElementById('btnDecompose').classList.remove('active');
      document.getElementById('btnDecompose').textContent = 'Descomponer / Recomponer';
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });

    animate(performance.now());
  </script>
</body>
</html>
